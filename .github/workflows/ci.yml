name: CI

# 创建 GitHub Release 需要写权限（否则报 Resource not accessible by integration）
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (lint + types)
    # tag 发版构建跳过重复检查：tag 指向的 commit 在 main 上已经验过
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (Windows)
    needs: check
    # check 被跳过（tag 构建）时也照常编译；check 失败则不编译
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri-action 不会自动识别 tag 触发，必须显式传 tagName 才会创建 Release
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'evernote-lite ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
