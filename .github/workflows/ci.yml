name: CI

# 创建 GitHub Release 需要写权限
permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '发版 tag（例如 v0.1.0），留空则只编译不发版'
        required: false
        default: ''

jobs:
  check:
    name: Check (lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 只有手动 Run workflow 并填了 tag 才发版；push 只编译不发版
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          releaseName: 'evernote-lite ${{ inputs.tag }}'
          releaseBody: 'See the assets to download and install this version.'
